<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Enregistrements audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-init.js"></script>
    <link rel="stylesheet" href="/css/style.css?v=20">
</head>
<body class="min-h-screen bg-white">
    <div class="min-h-screen flex items-center justify-center px-4 py-10 bg-white">
        <div class="w-full max-w-6xl bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2">
                <div class="relative p-8 md:p-10" style="background:#F5F5F5; color:#111111;">
                    <div class="inline-flex items-center gap-2 rounded-full bg-black/5 px-3 py-1 text-xs font-semibold text-slate-700 mb-5">
                        Smart Convers · Enregistrements &amp; relances
                    </div>
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-900 leading-tight mb-3">
                        Analyse audio<br>Twilio → OpenAI
                    </h1>
                    <p class="text-slate-600 text-sm md:text-base max-w-md">
                        Critères paramétrables, dashboard KPI et pipeline d'enregistrements. Architecture FastAPI + Postgres identique à Concentrix.
                    </p>
                </div>
                <div class="bg-white px-6 py-8 md:px-10 md:py-10">
                    <div class="mb-6">
                        <p class="text-sm font-semibold text-slate-500 uppercase tracking-wide">Connexion</p>
                        <p class="text-xs text-slate-400 mt-1">Compte admin créé au premier démarrage</p>
                    </div>
                    <form id="loginForm" class="space-y-4">
                        <div>
                            <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Identifiant</label>
                            <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@local.dev" class="input-app w-full px-3 py-3 text-sm">
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Mot de passe</label>
                            <div class="relative">
                                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" class="input-app w-full pr-12 px-3 py-3 text-sm">
                                <button type="button" id="togglePasswordVisibility" class="absolute inset-y-0 right-2 my-auto h-8 w-8 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="Afficher le mot de passe">👁</button>
                            </div>
                        </div>
                        <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>
                        <button type="submit" class="btn-primary-app w-full py-3 text-sm font-semibold flex items-center justify-center gap-2">
                            <span class="login-btn-label">Se connecter</span> <span aria-hidden="true">→</span>
                        </button>
                    </form>
                    <p class="mt-6 text-center text-xs text-slate-400">Démo : admin@local.dev / admin123</p>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/app.js?v=1"></script>
    <script src="/js/auth.js?v=1"></script>
</body>
</html>
